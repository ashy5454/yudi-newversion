<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research — YUDI AI Research Lab</title>
    <meta name="description" content="Explore the latest research papers and technical insights from YUDI AI Research Lab on brain-native AI architecture and LCoMs.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ══════════════════════════════════════════
           DESIGN TOKENS (mirrored from index.html)
           ══════════════════════════════════════════ */
        :root {
            --bg:               #030303;
            --surface:          rgba(255,255,255,0.03);
            --surface-hover:    rgba(255,255,255,0.07);
            --border:           rgba(255,255,255,0.08);
            --border-hover:     rgba(255,255,255,0.22);
            --text-primary:     rgba(255,255,255,0.95);
            --text-secondary:   rgba(255,255,255,0.5);
            --text-dim:         rgba(255,255,255,0.2);
            --font:             'Outfit', system-ui, sans-serif;
            --ease-spring:      cubic-bezier(0.16,1,0.3,1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ══════════════════════════════════════════
           BACKGROUND CANVAS
           ══════════════════════════════════════════ */
        #neural-canvas {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0; opacity: 0.25; pointer-events: none;
        }

        /* ══════════════════════════════════════════
           NAVBAR
           ══════════════════════════════════════════ */
        nav {
            position: fixed; top: 0; width: 100%; z-index: 100;
            padding: 1.5rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.4s ease;
        }
        nav.scrolled {
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 5%;
        }
        .logo img { height: 48px; width: auto; object-fit: contain; }
        .nav-links { display: flex; gap: 2.5rem; align-items: center; }
        .nav-links a {
            color: var(--text-secondary); text-decoration: none;
            font-size: 0.85rem; font-weight: 500;
            letter-spacing: 0.1em; text-transform: uppercase;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { color: #fff; }
        .nav-highlight {
            border: 1px solid var(--border);
            padding: 0.5rem 1rem; border-radius: 6px;
        }

        /* ══════════════════════════════════════════
           PAGE HEADER
           ══════════════════════════════════════════ */
        .page-header {
            padding: 14rem 5% 5rem;
            text-align: center;
            position: relative; z-index: 1;
        }
        .page-header .label {
            font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.25em;
            color: var(--text-dim); margin-bottom: 1.2rem;
        }
        .page-header h1 {
            font-size: clamp(3rem, 7vw, 6rem);
            font-weight: 800; letter-spacing: -0.04em;
            background: linear-gradient(180deg, #ffffff 0%, #555 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.2rem;
        }
        .page-header p {
            font-size: 1.05rem; font-weight: 300;
            color: var(--text-secondary); max-width: 520px; margin: 0 auto;
        }

        /* Divider bar */
        .divider {
            width: 100%; height: 1px;
            background: var(--border);
            margin: 0; position: relative; z-index: 1;
        }

        /* ══════════════════════════════════════════
           FILTER BAR
           ══════════════════════════════════════════ */
        .filter-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 2rem 5%;
            position: relative; z-index: 1;
            flex-wrap: wrap; gap: 1rem;
        }
        #post-count {
            font-size: 0.8rem; text-transform: uppercase;
            letter-spacing: 0.12em; color: var(--text-dim);
        }
        .sort-select {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: var(--font); font-size: 0.8rem;
            letter-spacing: 0.08em; text-transform: uppercase;
            padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;
        }
        .sort-select:focus { outline: none; border-color: var(--border-hover); }

        /* ══════════════════════════════════════════
           BLOG GRID
           ══════════════════════════════════════════ */
        .blog-section {
            padding: 0 5% 8rem;
            position: relative; z-index: 1;
        }
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        /* ── Post Card ── */
        .post-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1.2rem;
            overflow: hidden;
            text-decoration: none; color: inherit;
            display: flex; flex-direction: column;
            transition: all 0.45s var(--ease-spring);
            opacity: 0; transform: translateY(28px);
            animation: cardIn 0.6s var(--ease-spring) forwards;
        }
        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }
        .post-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-hover);
            transform: translateY(-6px);
            box-shadow: 0 24px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
        }

        /* Hero image */
        .card-image {
            width: 100%; aspect-ratio: 16/9;
            position: relative; overflow: hidden;
            background: rgba(255,255,255,0.03);
        }
        .card-image img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.6s var(--ease-spring);
            display: block;
        }
        .post-card:hover .card-image img { transform: scale(1.06); }
        .card-image-placeholder {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        .card-image-placeholder svg { opacity: 0.08; }

        /* Card body */
        .card-body { padding: 2rem; flex: 1; display: flex; flex-direction: column; }
        .card-meta {
            display: flex; align-items: center; gap: 0.6rem;
            margin-bottom: 1rem; flex-wrap: wrap;
        }
        .card-date, .card-author {
            font-size: 0.72rem; font-weight: 500;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--text-dim);
        }
        .card-meta-dot {
            width: 3px; height: 3px; border-radius: 50%;
            background: var(--text-dim); flex-shrink: 0;
        }
        .card-title {
            font-size: 1.15rem; font-weight: 700;
            letter-spacing: -0.02em; line-height: 1.3;
            margin-bottom: 0.75rem; color: var(--text-primary);
        }
        .card-summary {
            font-size: 0.9rem; font-weight: 300;
            color: var(--text-secondary); line-height: 1.65;
            flex: 1; display: -webkit-box;
            -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-footer {
            margin-top: 1.75rem; padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .card-cta {
            font-size: 0.78rem; font-weight: 600;
            letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--text-secondary);
            display: flex; align-items: center; gap: 0.4rem;
            transition: color 0.3s, gap 0.3s;
        }
        .post-card:hover .card-cta { color: #fff; gap: 0.7rem; }

        /* ── Skeleton loaders ── */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }
        .skeleton-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1.2rem; overflow: hidden;
        }
        .skeleton-img { width: 100%; aspect-ratio: 16/9; background: rgba(255,255,255,0.04); }
        .skeleton-body { padding: 2rem; }
        .skeleton-line {
            height: 10px; border-radius: 4px;
            background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            margin-bottom: 0.9rem;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .sl-meta { width: 50%; }
        .sl-title { width: 90%; height: 14px; }
        .sl-title2 { width: 70%; height: 14px; }
        .sl-body { width: 100%; }
        .sl-body2 { width: 80%; }
        .sl-body3 { width: 60%; }

        /* ── Empty state ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center; padding: 6rem 2rem;
        }
        .empty-state svg { opacity: 0.15; margin-bottom: 1.5rem; }
        .empty-state h3 { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
        .empty-state p { font-size: 0.9rem; color: var(--text-dim); }

        /* ── Error state ── */
        .error-state {
            grid-column: 1 / -1; text-align: center; padding: 4rem 2rem;
        }
        .error-state code {
            font-size: 0.8rem; color: rgba(255,100,100,0.7);
            background: rgba(255,50,50,0.06);
            padding: 0.2rem 0.6rem; border-radius: 4px;
        }

        /* ══════════════════════════════════════════
           FOOTER
           ══════════════════════════════════════════ */
        footer {
            text-align: center; padding: 3rem 5%;
            border-top: 1px solid var(--border);
            position: relative; z-index: 1;
        }
        footer p { color: var(--text-dim); font-size: 0.8rem; }
        .footer-logo { font-weight: 800; letter-spacing: 0.2em; color: var(--text-dim); margin-bottom: 0.4rem; }

        /* ══════════════════════════════════════════
           RESPONSIVE
           ══════════════════════════════════════════ */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .blog-grid, .skeleton-grid { grid-template-columns: 1fr; }
            .page-header { padding: 10rem 5% 4rem; }
        }
    </style>
</head>
<body>

<canvas id="neural-canvas"></canvas>

<!-- ═══════ NAVBAR ═══════ -->
<nav id="navbar">
    <a href="index.html" class="logo">
        <img src="logo.png" alt="YUDI Logo"
             onerror="this.outerHTML='<span style=\'font-weight:800;font-size:1.5rem;letter-spacing:0.1em;text-transform:uppercase;color:#fff;\'>YUDI.</span>'">
    </a>
    <div class="nav-links">
        <a href="index.html#research">Research</a>
        <a href="index.html#products">Products</a>
        <a href="blogs.html" class="active">Blogs</a>
        <a href="index.html#architecture">Architecture</a>
        <a href="index.html#recruit" class="nav-highlight">Join the Lab</a>
    </div>
</nav>

<!-- ═══════ PAGE HEADER ═══════ -->
<header class="page-header">
    <div class="label">YUDI AI Research Lab</div>
    <h1>Research</h1>
    <p>Technical papers, findings, and architectural insights from our lab.</p>
</header>

<div class="divider"></div>

<!-- ═══════ FILTER BAR ═══════ -->
<div class="filter-bar">
    <span id="post-count">Loading papers…</span>
    <select class="sort-select" id="sort-select" onchange="renderPosts()">
        <option value="desc">Newest First</option>
        <option value="asc">Oldest First</option>
    </select>
</div>

<!-- ═══════ BLOG GRID ═══════ -->
<main class="blog-section">
    <!-- Skeleton appears immediately -->
    <div class="skeleton-grid" id="skeleton-grid">
        <!-- 6 skeleton cards generated by JS -->
    </div>

    <!-- Real posts injected here -->
    <div class="blog-grid" id="blog-grid" style="display:none;"></div>
</main>

<!-- ═══════ FOOTER ═══════ -->
<footer>
    <div class="footer-logo">YUDI.</div>
    <p>&copy; 2026 YUDI AI Research Lab. All rights reserved.</p>
</footer>

<script>
    /* ─────────────────────────────────────────────────────
       CONFIG — replace YOUR_PROJECT_ID with your Sanity
       Project ID after running: npm create sanity@latest
    ───────────────────────────────────────────────────── */
    const PROJECT_ID = "7xfeub9j";
    const DATASET    = "production";
    const API_VER    = "2023-01-01";

    const ENDPOINT = `https://${PROJECT_ID}.api.sanity.io/v${API_VER}/data/query/${DATASET}`;

    /* ─────────────── Background Neural Canvas ─────────── */
    (function () {
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        let nodes = [];

        function init() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            const count = window.innerWidth < 768 ? 35 : 70;
            nodes = Array.from({ length: count }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                r: Math.random() * 1.2 + 0.4,
            }));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            nodes.forEach((n, i) => {
                n.x += n.vx; n.y += n.vy;
                if (n.x < 0 || n.x > canvas.width)  n.vx *= -1;
                if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fill();
                nodes.slice(i + 1).forEach(m => {
                    const d = Math.hypot(n.x - m.x, n.y - m.y);
                    if (d < 140) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255,255,255,${0.12 * (1 - d / 140)})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(n.x, n.y); ctx.lineTo(m.x, m.y);
                        ctx.stroke();
                    }
                });
            });
            requestAnimationFrame(draw);
        }

        init(); draw();
        window.addEventListener('resize', init);
    })();

    /* ─────────────── Navbar scroll ─────────────────── */
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
        navbar.classList.toggle('scrolled', window.scrollY > 60);
    });

    /* ─────────────── Skeleton Loader ───────────────── */
    const skeletonGrid = document.getElementById('skeleton-grid');

    function makeSkeleton() {
        return `
        <div class="skeleton-card">
            <div class="skeleton-img"></div>
            <div class="skeleton-body">
                <div class="skeleton-line sl-meta"></div>
                <div class="skeleton-line sl-title"></div>
                <div class="skeleton-line sl-title2"></div>
                <div class="skeleton-line sl-body" style="margin-top:1rem;"></div>
                <div class="skeleton-line sl-body2"></div>
                <div class="skeleton-line sl-body3"></div>
            </div>
        </div>`;
    }

    skeletonGrid.innerHTML = Array.from({ length: 6 }, makeSkeleton).join('');

    /* ─────────────── Fetch & Render ─────────────────── */
    let allPosts = [];

    const QUERY = `*[_type == "post"] | order(publishedAt desc){
        title,
        "slug": slug.current,
        summary,
        author,
        publishedAt,
        "imageUrl": mainImage.asset->url
    }`;

    fetch(`${ENDPOINT}?query=${encodeURIComponent(QUERY)}`)
        .then(r => r.json())
        .then(data => {
            allPosts = data.result || [];
            hideSkeleton();
            renderPosts();
        })
        .catch(err => {
            hideSkeleton();
            showError(err);
        });

    function hideSkeleton() {
        skeletonGrid.style.display = 'none';
        document.getElementById('blog-grid').style.display = 'grid';
    }

    function renderPosts() {
        const grid = document.getElementById('blog-grid');
        const order = document.getElementById('sort-select').value;
        const counter = document.getElementById('post-count');

        const posts = [...allPosts].sort((a, b) => {
            const da = new Date(a.publishedAt), db = new Date(b.publishedAt);
            return order === 'asc' ? da - db : db - da;
        });

        if (posts.length === 0) {
            counter.textContent = '0 Papers';
            grid.innerHTML = `
                <div class="empty-state">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <h3>No papers published yet</h3>
                    <p>Check back soon — research is in progress.</p>
                </div>`;
            return;
        }

        counter.textContent = `${posts.length} Paper${posts.length !== 1 ? 's' : ''}`;

        grid.innerHTML = posts.map((post, i) => {
            const date = post.publishedAt
                ? new Date(post.publishedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
                : '';

            const imageHtml = post.imageUrl
                ? `<img src="${post.imageUrl}?w=720&auto=format" alt="${escHtml(post.title)}" loading="lazy">`
                : `<div class="card-image-placeholder">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.8">
                        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                   </div>`;

            return `
            <a class="post-card" href="blog.html?slug=${encodeURIComponent(post.slug || '')}"
               style="animation-delay:${i * 0.07}s">
                <div class="card-image">${imageHtml}</div>
                <div class="card-body">
                    <div class="card-meta">
                        ${date ? `<span class="card-date">${date}</span>` : ''}
                        ${date && post.author ? '<span class="card-meta-dot"></span>' : ''}
                        ${post.author ? `<span class="card-author">${escHtml(post.author)}</span>` : ''}
                    </div>
                    <h2 class="card-title">${escHtml(post.title || 'Untitled')}</h2>
                    <p class="card-summary">${escHtml(post.summary || '')}</p>
                    <div class="card-footer">
                        <span class="card-cta">
                            Read Paper
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </span>
                    </div>
                </div>
            </a>`;
        }).join('');
    }

    function showError(err) {
        const grid = document.getElementById('blog-grid');
        document.getElementById('post-count').textContent = 'Error';
        grid.innerHTML = `
            <div class="error-state">
                <p style="color:var(--text-secondary); margin-bottom:0.5rem;">Could not load research papers.</p>
                <code>${err.message}</code>
            </div>`;
    }

    function escHtml(str) {
        return String(str)
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;');
    }
</script>
</body>
</html>
